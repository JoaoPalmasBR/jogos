<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Jogos - Estilo PS3 (XMB)</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --xmb-bg: #111;
            --xmb-highlight: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--xmb-bg);
            /* Simulação clássica da onda do PS3 com gradientes em movimento */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05) 0%, transparent 60%),
                linear-gradient(45deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Linha Guia XMB */
        .xmb-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            z-index: 1;
        }

        /* Ribbon Horizontal */
        .xmb-ribbon {
            display: flex;
            align-items: center;
            gap: 40px;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 10;
        }

        .xmb-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.5;
            transform: scale(0.8);
            transition: all 0.2s;
            cursor: pointer;
        }

        .xmb-icon {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            object-fit: cover;
            border: 2px solid transparent;
            margin-bottom: 20px;
        }

        .xmb-title {
            font-size: 1.2rem;
            font-weight: 300;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .xmb-item.active {
            opacity: 1;
            transform: scale(1.3);
        }

        .xmb-item.active .xmb-icon {
            border-color: rgba(255,255,255,0.8);
            box-shadow: 0 0 20px rgba(255,255,255,0.6);
        }

        .xmb-item.active .xmb-title {
            opacity: 1;
        }

        .play-hint {
            position: absolute;
            bottom: 20%;
            font-size: 0.9rem;
            color: #aaa;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .play-hint.visible {
            opacity: 1;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Theme Switcher */
        .theme-switcher {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 20px;
            background: transparent;
            z-index: 20;
        }

        .theme-btn {
            color: #888;
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .theme-btn:hover {
            color: #ddd;
        }

        .theme-btn.active {
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <div class="xmb-line"></div>

    <div class="xmb-ribbon" id="ribbon">
        <!-- Itens injetados -->
    </div>

    <div class="play-hint" id="play-hint">Pressione [ENTER] ou clique no ícone para iniciar</div>

    <div class="theme-switcher">
        <a href="index_ps2.html" class="theme-btn">PS2</a>
        <a href="index_ps3.html" class="theme-btn active">PS3</a>
        <a href="index_ps4.html" class="theme-btn">PS4</a>
        <a href="index_ps5.html" class="theme-btn">PS5</a>
    </div>

    <script>
        let jogos = [];
        let currentIndex = 0;

        async function carregarJogos() {
            try {
                const response = await fetch('jogos.json');
                jogos = await response.json();
                renderizarRibbon();
                selecionarJogo(0);
            } catch (error) {
                console.error(error);
            }
        }

        function renderizarRibbon() {
            const ribbon = document.getElementById('ribbon');
            ribbon.innerHTML = '';
            
            jogos.forEach((jogo, index) => {
                const item = document.createElement('div');
                item.className = 'xmb-item';
                item.onclick = () => {
                    if (currentIndex === index && jogo.pasta !== "#") {
                        window.location.href = `${jogo.pasta}/`;
                    } else {
                        selecionarJogo(index);
                    }
                };
                
                const img = document.createElement('img');
                img.className = 'xmb-icon';
                img.src = jogo.imagem_capa;
                
                const title = document.createElement('div');
                title.className = 'xmb-title';
                title.textContent = jogo.nome;
                
                item.appendChild(img);
                item.appendChild(title);
                ribbon.appendChild(item);
            });
        }

        function selecionarJogo(index) {
            const items = document.querySelectorAll('.xmb-item');
            items.forEach(t => t.classList.remove('active'));
            
            if(items[index]) {
                items[index].classList.add('active');
            }

            const jogo = jogos[index];
            const hint = document.getElementById('play-hint');
            
            if (jogo.pasta !== "#") {
                hint.classList.add('visible');
            } else {
                hint.classList.remove('visible');
            }

            // Centraliza o item ativo na tela
            // A largura base de cada item + gap é aprox 140px
            const offset = index * -140; 
            // Adicionamos um deslocamento para centrar dependendo da quantidade (cálculo simples para alinhar ao centro visual)
            const centerAdjust = (items.length * 140) / 2 - 70;
            document.getElementById('ribbon').style.transform = `translateX(${offset + centerAdjust}px)`;
            
            currentIndex = index;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentIndex < jogos.length - 1) {
                selecionarJogo(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                selecionarJogo(currentIndex - 1);
            } else if (e.key === 'Enter') {
                if (jogos[currentIndex] && jogos[currentIndex].pasta !== "#") {
                    window.location.href = `${jogos[currentIndex].pasta}/`;
                }
            }
        });

        carregarJogos();
    </script>
</body>
</html>
