<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Jogos - Estilo PS4</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ps4-blue: #003791;
            --ps4-light-blue: #0072ce;
            --ps4-bg: linear-gradient(135deg, #000c24 0%, #002b7a 50%, #005bb5 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: var(--ps4-bg);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        /* Particle Overlay */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
        }

        /* Top Bar */
        header {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 30px 60px;
            gap: 30px;
            z-index: 10;
            opacity: 0.85;
            font-size: 18px;
        }

        .header-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .header-item:hover {
            opacity: 1;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #0072ce;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* Content Area */
        .content-area {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 80px;
            margin-top: -30px;
            z-index: 10;
        }

        .game-title-header {
            font-size: 2.8rem;
            font-weight: 300;
            margin-bottom: 25px;
            opacity: 0;
            transform: translateY(-12px);
            transition: all 0.35s ease;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .game-title-header.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Carousel */
        .carousel-wrapper {
            width: 100%;
            overflow: visible;
        }

        .carousel {
            display: flex;
            gap: 16px;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .game-tile {
            min-width: 190px;
            width: 190px;
            height: 190px;
            background: rgba(255,255,255,0.08);
            border: 2px solid transparent;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .game-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-tile.active {
            transform: scale(1.16);
            border-color: #ffffff;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7), 0 0 25px rgba(0, 114, 206, 0.8);
            z-index: 10;
        }

        /* Game Details Card */
        .game-info {
            margin-top: 45px;
            max-width: 650px;
            opacity: 0;
            transition: opacity 0.35s ease;
            background: rgba(0, 15, 45, 0.4);
            padding: 25px;
            border-radius: 12px;
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .game-info.visible {
            opacity: 1;
        }

        .game-desc {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #d6e8ff;
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .play-btn {
            background-color: #ffffff;
            color: var(--ps4-blue);
            border: none;
            padding: 12px 36px;
            font-size: 1.15rem;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .play-btn:hover {
            background-color: #e6f0ff;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255,255,255,0.4);
        }

        .option-btn {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Pill Switcher Widget */
        .theme-switcher-pill {
            position: absolute;
            bottom: 30px;
            right: 60px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 15, 45, 0.65);
            padding: 6px 8px;
            border-radius: 30px;
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            z-index: 20;
        }

        .theme-btn {
            background: transparent;
            color: rgba(255,255,255,0.6);
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            transition: all 0.25s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }

        .theme-btn.active {
            color: var(--ps4-blue);
            background: #ffffff;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(255,255,255,0.3);
        }

        .theme-btn .led {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #555;
        }

        .theme-btn.active .led {
            background: #0072ce;
            box-shadow: 0 0 6px #0072ce;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <header>
        <div class="header-item" title="Notificações">🔔 <span>3</span></div>
        <div class="header-item" title="Amigos">👥</div>
        <div class="header-item" title="Troféus">🏆</div>
        <div class="header-item" title="Perfil"><div class="user-avatar">JP</div></div>
        <div class="header-item" id="live-clock">12:00</div>
    </header>

    <div class="content-area">
        <div class="game-title-header" id="game-title">Carregando...</div>
        
        <div class="carousel-wrapper">
            <div class="carousel" id="carousel">
                <!-- Tiles -->
            </div>
        </div>

        <div class="game-info" id="game-info">
            <p class="game-desc" id="game-desc"></p>
            <div class="btn-group">
                <a href="#" class="play-btn" id="play-btn">Iniciar</a>
                <button class="option-btn">⋯ Opções</button>
            </div>
        </div>
    </div>

    <!-- Seletor Pill Estilizado -->
    <div class="theme-switcher-pill">
        <a href="ps2" class="theme-btn"><span class="led"></span>PS2</a>
        <a href="ps3" class="theme-btn"><span class="led"></span>PS3</a>
        <a href="ps4" class="theme-btn active"><span class="led"></span>PS4</a>
        <a href="ps5" class="theme-btn"><span class="led"></span>PS5</a>
    </div>

    <script>
        let jogos = [];
        let currentIndex = 0;

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('live-clock').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Canvas de Partículas Estilo PS4
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 1,
                vx: (Math.random() - 0.5) * 0.5,
                vy: -Math.random() * 0.5 - 0.2,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.y < 0) p.y = canvas.height;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        async function carregarJogos() {
            try {
                const response = await fetch('jogos.json');
                jogos = await response.json();
                renderizarTiles();
                selecionarJogo(0);
            } catch (error) {
                console.error(error);
                document.getElementById('game-title').textContent = "Erro";
            }
        }

        function renderizarTiles() {
            const carousel = document.getElementById('carousel');
            carousel.innerHTML = '';
            
            jogos.forEach((jogo, index) => {
                const tile = document.createElement('div');
                tile.className = 'game-tile';
                tile.onclick = () => selecionarJogo(index);
                
                const img = document.createElement('img');
                img.src = jogo.imagem_capa;
                
                tile.appendChild(img);
                carousel.appendChild(tile);
            });
        }

        function selecionarJogo(index) {
            const tiles = document.querySelectorAll('.game-tile');
            tiles.forEach(t => t.classList.remove('active'));
            
            if(tiles[index]) {
                tiles[index].classList.add('active');
            }

            const jogo = jogos[index];
            const title = document.getElementById('game-title');
            const info = document.getElementById('game-info');
            const desc = document.getElementById('game-desc');
            const btn = document.getElementById('play-btn');

            title.classList.remove('visible');
            info.classList.remove('visible');
            
            setTimeout(() => {
                title.textContent = jogo.nome;
                desc.textContent = jogo.descricao;
                
                if(jogo.pasta !== "#") {
                    btn.href = `${jogo.pasta}/`;
                    btn.style.display = 'inline-block';
                } else {
                    btn.style.display = 'none';
                }
                
                title.classList.add('visible');
                info.classList.add('visible');
                
                const offset = index * -206; 
                document.getElementById('carousel').style.transform = `translateX(${offset}px)`;
            }, 150);
            
            currentIndex = index;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentIndex < jogos.length - 1) {
                selecionarJogo(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                selecionarJogo(currentIndex - 1);
            } else if (e.key === 'Enter') {
                document.getElementById('play-btn').click();
            }
        });

        carregarJogos();
    </script>
</body>
</html>
