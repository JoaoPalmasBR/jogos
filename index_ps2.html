<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Jogos - Estilo PS2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        :root {
            --ps2-bg-color: #000033;
            --ps2-fog: rgba(0, 50, 150, 0.4);
            --ps2-text: #ccc;
            --ps2-highlight: #fff;
            --ps2-block: rgba(0, 0, 80, 0.5);
            --ps2-block-border: #44aaff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--ps2-bg-color);
            /* Simulação da névoa e escuridão do boot do PS2 */
            background-image: radial-gradient(circle at center, var(--ps2-fog) 0%, #000000 80%);
            color: var(--ps2-text);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .browser-title {
            position: absolute;
            top: 40px;
            font-size: 24px;
            letter-spacing: 5px;
            color: var(--ps2-highlight);
            text-shadow: 0 0 10px var(--ps2-block-border);
        }

        .memory-blocks {
            display: flex;
            gap: 20px;
            perspective: 800px;
        }

        .block {
            width: 120px;
            height: 120px;
            background: var(--ps2-block);
            border: 2px solid rgba(68, 170, 255, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
        }

        .block img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
            opacity: 0.7;
            filter: grayscale(50%);
        }

        .block span {
            font-size: 12px;
            font-weight: bold;
            color: var(--ps2-text);
        }

        .block.active {
            border-color: var(--ps2-highlight);
            background: rgba(0, 50, 150, 0.8);
            transform: translateZ(30px);
            box-shadow: 0 0 15px var(--ps2-block-border), inset 0 0 10px var(--ps2-highlight);
        }

        .block.active img {
            opacity: 1;
            filter: grayscale(0%);
        }
        
        .block.active span {
            color: var(--ps2-highlight);
        }

        .desc-box {
            margin-top: 50px;
            width: 600px;
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            color: var(--ps2-highlight);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .desc-box.visible {
            opacity: 1;
        }

        .controls {
            position: absolute;
            bottom: 80px;
            font-size: 14px;
            color: var(--ps2-text);
        }

        /* Theme Switcher */
        .theme-switcher {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 20px;
            z-index: 20;
        }

        .theme-btn {
            color: var(--ps2-text);
            text-decoration: none;
            font-size: 12px;
            padding: 5px 10px;
            border: 1px solid transparent;
        }

        .theme-btn:hover {
            color: var(--ps2-highlight);
        }

        .theme-btn.active {
            color: var(--ps2-highlight);
            border-color: var(--ps2-highlight);
        }
    </style>
</head>
<body>

    <div class="browser-title">Browser</div>

    <div class="memory-blocks" id="blocks-container">
        <!-- Blocos injetados -->
    </div>

    <div class="desc-box" id="game-desc"></div>

    <div class="controls" id="controls-hint">
        X Entrar  &nbsp;&nbsp;&nbsp; ▲ Voltar
    </div>

    <div class="theme-switcher">
        <a href="index_ps2.html" class="theme-btn active">PS2</a>
        <a href="index_ps3.html" class="theme-btn">PS3</a>
        <a href="index_ps4.html" class="theme-btn">PS4</a>
        <a href="index_ps5.html" class="theme-btn">PS5</a>
    </div>

    <script>
        let jogos = [];
        let currentIndex = 0;

        async function carregarJogos() {
            try {
                const response = await fetch('jogos.json');
                jogos = await response.json();
                renderizarBlocos();
                selecionarJogo(0);
            } catch (error) {
                console.error(error);
                document.getElementById('game-desc').textContent = "Dados corrompidos.";
                document.getElementById('game-desc').classList.add('visible');
            }
        }

        function renderizarBlocos() {
            const container = document.getElementById('blocks-container');
            container.innerHTML = '';
            
            jogos.forEach((jogo, index) => {
                const block = document.createElement('div');
                block.className = 'block';
                block.onclick = () => {
                    if (currentIndex === index && jogo.pasta !== "#") {
                        window.location.href = `${jogo.pasta}/`;
                    } else {
                        selecionarJogo(index);
                    }
                };
                
                const img = document.createElement('img');
                img.src = jogo.imagem_capa;
                
                const span = document.createElement('span');
                span.textContent = jogo.nome;
                
                block.appendChild(img);
                block.appendChild(span);
                container.appendChild(block);
            });
        }

        function selecionarJogo(index) {
            const blocks = document.querySelectorAll('.block');
            blocks.forEach(b => b.classList.remove('active'));
            
            if(blocks[index]) {
                blocks[index].classList.add('active');
            }

            const jogo = jogos[index];
            const desc = document.getElementById('game-desc');
            const hint = document.getElementById('controls-hint');
            
            desc.classList.remove('visible');
            
            setTimeout(() => {
                desc.textContent = jogo.descricao;
                desc.classList.add('visible');
                
                if (jogo.pasta !== "#") {
                    hint.style.opacity = '1';
                } else {
                    hint.style.opacity = '0.3';
                }
            }, 150);
            
            currentIndex = index;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentIndex < jogos.length - 1) {
                selecionarJogo(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                selecionarJogo(currentIndex - 1);
            } else if (e.key === 'Enter' || e.key === 'x' || e.key === 'X') {
                if (jogos[currentIndex] && jogos[currentIndex].pasta !== "#") {
                    window.location.href = `${jogos[currentIndex].pasta}/`;
                }
            }
        });

        carregarJogos();
    </script>
</body>
</html>
