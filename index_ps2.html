<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Jogos - Estilo PS2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --ps2-bg-color: #000022;
            --ps2-fog: rgba(0, 40, 120, 0.45);
            --ps2-text: #88aacc;
            --ps2-highlight: #ffffff;
            --ps2-block: rgba(5, 20, 60, 0.65);
            --ps2-block-border: #3388ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
        }

        body {
            background-color: var(--ps2-bg-color);
            background-image: radial-gradient(circle at center, var(--ps2-fog) 0%, #00000c 90%);
            color: var(--ps2-text);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 3D Floating Pillars (PS2 BIOS Towers) */
        .pillars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 600px;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .pillar {
            position: absolute;
            bottom: -50px;
            width: 40px;
            background: linear-gradient(180deg, rgba(50,120,255,0.2) 0%, rgba(0,20,80,0.6) 100%);
            border: 1px solid rgba(100,180,255,0.3);
            box-shadow: 0 0 15px rgba(0,100,255,0.2);
            animation: floatUp 8s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotateY(0deg); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-700px) rotateY(180deg); opacity: 0; }
        }

        /* Header Info */
        header {
            position: absolute;
            top: 40px;
            left: 60px;
            right: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .browser-title {
            font-size: 26px;
            letter-spacing: 6px;
            color: var(--ps2-highlight);
            text-shadow: 0 0 12px var(--ps2-block-border);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .mc-icon {
            width: 24px;
            height: 20px;
            border: 2px solid #3388ff;
            border-radius: 3px;
            display: inline-block;
            box-shadow: 0 0 8px #3388ff;
        }

        .system-clock {
            font-size: 16px;
            color: #5599cc;
            letter-spacing: 2px;
        }

        /* Memory Blocks Container */
        .memory-blocks {
            display: flex;
            gap: 30px;
            perspective: 1000px;
            z-index: 10;
        }

        .block {
            width: 140px;
            height: 140px;
            background: var(--ps2-block);
            border: 2px solid rgba(51, 136, 255, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: inset 0 0 25px rgba(0,0,0,0.9), 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
            transform-style: preserve-3d;
        }

        .block img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 12px;
            opacity: 0.6;
            filter: grayscale(40%);
            transition: all 0.3s;
        }

        .block span {
            font-size: 13px;
            font-weight: bold;
            color: var(--ps2-text);
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .block.active {
            border-color: var(--ps2-highlight);
            background: rgba(0, 60, 180, 0.75);
            transform: translateZ(40px) rotateX(10deg);
            box-shadow: 0 0 25px var(--ps2-block-border), inset 0 0 15px var(--ps2-highlight);
        }

        .block.active img {
            opacity: 1;
            filter: grayscale(0%);
            transform: scale(1.08);
        }
        
        .block.active span {
            color: var(--ps2-highlight);
            text-shadow: 0 0 8px var(--ps2-highlight);
        }

        /* Description Box */
        .desc-box {
            margin-top: 55px;
            width: 650px;
            text-align: center;
            font-size: 16px;
            line-height: 1.6;
            color: var(--ps2-highlight);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
            background: rgba(0, 10, 30, 0.7);
            padding: 20px 30px;
            border: 1px solid rgba(51, 136, 255, 0.3);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .desc-box.visible {
            opacity: 1;
        }

        .controls {
            position: absolute;
            bottom: 40px;
            left: 60px;
            font-size: 14px;
            color: var(--ps2-text);
            z-index: 10;
            letter-spacing: 2px;
        }

        /* Pill Switcher Widget */
        .theme-switcher-pill {
            position: absolute;
            bottom: 30px;
            right: 60px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 10, 30, 0.75);
            padding: 6px 8px;
            border-radius: 30px;
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(51, 136, 255, 0.4);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            z-index: 20;
        }

        .theme-btn {
            background: transparent;
            color: rgba(255,255,255,0.6);
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            transition: all 0.25s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }

        .theme-btn.active {
            color: #000;
            background: #ffffff;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(255,255,255,0.3);
        }

        .theme-btn .led {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #555;
        }

        .theme-btn.active .led {
            background: #3388ff;
            box-shadow: 0 0 6px #3388ff;
        }
    </style>
</head>
<body>

    <!-- Dynamic Pillars -->
    <div class="pillars-bg" id="pillars-bg"></div>

    <header>
        <div class="browser-title"><span class="mc-icon"></span> MEMORY CARD (8MB)</div>
        <div class="system-clock" id="live-clock">2026/07/30 12:00:00</div>
    </header>

    <div class="memory-blocks" id="blocks-container">
        <!-- Blocos injetados -->
    </div>

    <div class="desc-box" id="game-desc"></div>

    <div class="controls" id="controls-hint">
        [ENTER] Executar &nbsp;&nbsp;&nbsp; [◄/►] Selecionar
    </div>

    <!-- Seletor Pill Estilizado -->
    <div class="theme-switcher-pill">
        <a href="index_ps2.html" class="theme-btn active"><span class="led"></span>PS2</a>
        <a href="index_ps3.html" class="theme-btn"><span class="led"></span>PS3</a>
        <a href="index_ps4.html" class="theme-btn"><span class="led"></span>PS4</a>
        <a href="index_ps5.html" class="theme-btn"><span class="led"></span>PS5</a>
    </div>

    <script>
        let jogos = [];
        let currentIndex = 0;

        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').textContent = `${year}/${month}/${day} ${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Gerar Pilares 3D PS2
        const pillarsBg = document.getElementById('pillars-bg');
        for (let i = 0; i < 15; i++) {
            const pillar = document.createElement('div');
            pillar.className = 'pillar';
            pillar.style.left = `${Math.random() * 100}%`;
            pillar.style.height = `${Math.random() * 250 + 100}px`;
            pillar.style.animationDelay = `${Math.random() * 8}s`;
            pillar.style.animationDuration = `${Math.random() * 6 + 6}s`;
            pillarsBg.appendChild(pillar);
        }

        async function carregarJogos() {
            try {
                const response = await fetch('jogos.json');
                jogos = await response.json();
                renderizarBlocos();
                selecionarJogo(0);
            } catch (error) {
                console.error(error);
                document.getElementById('game-desc').textContent = "Dados corrompidos.";
                document.getElementById('game-desc').classList.add('visible');
            }
        }

        function renderizarBlocos() {
            const container = document.getElementById('blocks-container');
            container.innerHTML = '';
            
            jogos.forEach((jogo, index) => {
                const block = document.createElement('div');
                block.className = 'block';
                block.onclick = () => {
                    if (currentIndex === index && jogo.pasta !== "#") {
                        window.location.href = `${jogo.pasta}/`;
                    } else {
                        selecionarJogo(index);
                    }
                };
                
                const img = document.createElement('img');
                img.src = jogo.imagem_capa;
                
                const span = document.createElement('span');
                span.textContent = jogo.nome;
                
                block.appendChild(img);
                block.appendChild(span);
                container.appendChild(block);
            });
        }

        function selecionarJogo(index) {
            const blocks = document.querySelectorAll('.block');
            blocks.forEach(b => b.classList.remove('active'));
            
            if(blocks[index]) {
                blocks[index].classList.add('active');
            }

            const jogo = jogos[index];
            const desc = document.getElementById('game-desc');
            const hint = document.getElementById('controls-hint');
            
            desc.classList.remove('visible');
            
            setTimeout(() => {
                desc.textContent = jogo.descricao;
                desc.classList.add('visible');
                
                if (jogo.pasta !== "#") {
                    hint.style.opacity = '1';
                } else {
                    hint.style.opacity = '0.4';
                }
            }, 150);
            
            currentIndex = index;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentIndex < jogos.length - 1) {
                selecionarJogo(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                selecionarJogo(currentIndex - 1);
            } else if (e.key === 'Enter' || e.key === 'x' || e.key === 'X') {
                if (jogos[currentIndex] && jogos[currentIndex].pasta !== "#") {
                    window.location.href = `${jogos[currentIndex].pasta}/`;
                }
            }
        });

        carregarJogos();
    </script>
</body>
</html>
